# Harness: local chain (Anvil, chainId 8453, USDC mock at the mainnet address), a second chain for the konto walk
# (chainId 84532, Base Sepolia contract code), control plane
# behind TLS (own CA) with a local settler, a rebuilt sandboxd, unmodified upstream runtime.
x-anvil-account-0-key: &relayer-key "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"

services:
  chain:
    image: ghcr.io/foundry-rs/foundry:latest
    entrypoint: ["anvil"]
    command: ["--chain-id", "8453", "--host", "0.0.0.0", "--port", "8545", "--silent"]
    healthcheck:
      test: ["CMD-SHELL", "cast chain-id --rpc-url http://127.0.0.1:8545 | grep -q 8453"]
      interval: 2s
      timeout: 3s
      retries: 15

  chain-tools:
    build:
      context: ./chain
    environment:
      RPC_URL: http://chain:8545
      USDC_ADDRESS: "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"
      FUNDER_KEY: *relayer-key
    depends_on:
      chain:
        condition: service_healthy

  # Second chain for goals/konto/03: chainId 84532 (Base Sepolia). konto-chain.mjs places the runtime code of the real
  # Base Sepolia contracts (harness/chain/konto/) here with anvil_setCode; the USDC mock sits at the test USDC address.
  chain-konto:
    image: ghcr.io/foundry-rs/foundry:latest
    entrypoint: ["anvil"]
    command: ["--chain-id", "84532", "--host", "0.0.0.0", "--port", "8545", "--silent"]
    healthcheck:
      test: ["CMD-SHELL", "cast chain-id --rpc-url http://127.0.0.1:8545 | grep -q 84532"]
      interval: 2s
      timeout: 3s
      retries: 15

  # The image of chain-tools (viem and solc in /chain/node_modules) with the konto walk and the contract code mounted
  # in; not part of the image. Commands: "chain.mjs setup" (USDC mock) and "konto-chain.mjs" (the walk).
  chain-konto-tools:
    build:
      context: ./chain
    entrypoint: ["node"]
    command: ["konto-chain.mjs"]
    environment:
      RPC_URL: http://chain-konto:8545
      CHAIN_ID: "84532"
      USDC_ADDRESS: "0x036CbD53842c5426634e7929541eC2318f3dCF7e"
      KONTO_DIR: /chain/konto
    volumes:
      - ./e2e/konto-chain.mjs:/chain/konto-chain.mjs:ro
      - ./chain/konto:/chain/konto:ro
    depends_on:
      chain-konto:
        condition: service_healthy

  cp:
    build:
      context: ..
      dockerfile: harness/cp/Dockerfile
    environment:
      CP_HOST: 0.0.0.0
      CP_PORT: "8443"
      CP_DB_PATH: /data/cp.db
      CP_TLS_CERT: /certs/cp.test.pem
      CP_TLS_KEY: /certs/cp.test-key.pem
      NODE_EXTRA_CA_CERTS: /certs/ca.pem
      # Topup: payTo is Anvil account 1, the settler sends with account 0 (harness only).
      CP_PAY_TO: "0x70997970C51812dc3A010C7d01b50e0d17dc79C8"
      CP_NETWORK: base
      CP_USDC_ADDRESS: "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"
      CP_SETTLER: local
      CP_RPC_URL: http://chain:8545
      CP_SETTLER_KEY: *relayer-key
      # Inference: mock provider without network; e2e:live sets CP_PROVIDER=openrouter and passes
      # the key through from the host environment (never from a file).
      CP_PROVIDER: ${CP_PROVIDER:-mock}
      CP_MODEL_ALIASES: ${CP_MODEL_ALIASES-gpt-5.2=mock-1,gpt-5-mini=mock-1,gpt-5.3=mock-1}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Sandboxes go to the rebuilt sandboxd below, signed with the key cp makes in /data on its first start.
      CP_SANDBOXD_URL: http://sandboxd:8730
    volumes:
      - ./certs:/certs:ro
      - cp-data:/data
    networks:
      default:
        aliases:
          - cp.test
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('https://cp.test:8443/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Rebuilt sandboxd (goals/sandbox/04): the real ops/sandbox/sandboxd.mjs, commands of a sandbox as processes in
  # this container instead of Docker. It reads the public key cp wrote (/data/sandbox-client.pub) from cp-data, read
  # only, and is reachable inside the compose network only (no ports).
  sandboxd:
    build:
      context: ..
      dockerfile: harness/sandboxd/Dockerfile
    environment:
      SANDBOXD_KEYS_DIR: /cp-data
    volumes:
      - cp-data:/cp-data:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8730/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 15
    depends_on:
      cp:
        condition: service_healthy

  runtime:
    build:
      context: ./runtime
    environment:
      CONWAY_API_URL: https://cp.test:8443
      NODE_EXTRA_CA_CERTS: /certs/ca.pem
      AUTOMATON_RPC_URL: http://chain:8545
    volumes:
      - ./certs:/certs:ro
      - ${SETUP_JSON:-./runtime/setup.json}:/setup.json:ro
      - runtime-home:/home/automaton
      # The sandbox walk (harness/e2e/sandbox-walk.mjs), the long exec walk (harness/e2e/long-exec.mjs) and the relay walk
      # (harness/e2e/relay-walk.mjs) with the runtime's own client and tools, and what they share (runtime-tap.mjs); not part
      # of the image.
      - ./e2e/sandbox-walk.mjs:/opt/harness/sandbox-walk.mjs:ro
      - ./e2e/long-exec.mjs:/opt/harness/long-exec.mjs:ro
      - ./e2e/runtime-tap.mjs:/opt/harness/runtime-tap.mjs:ro
      - ./e2e/relay-walk.mjs:/opt/harness/relay-walk.mjs:ro
    depends_on:
      cp:
        condition: service_healthy

volumes:
  cp-data:
  runtime-home:
