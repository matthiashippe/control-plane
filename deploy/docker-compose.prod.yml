# Betrieb auf srv1336627: Control Plane (nur im Compose-Netz) hinter Caddy (Let's Encrypt).
# Secrets kommen aus /opt/control-plane/.env (Mode 600), nie aus dem Repo.
services:
  cp:
    build:
      context: ..
      dockerfile: harness/cp/Dockerfile
    image: control-plane:latest
    restart: unless-stopped
    env_file: .env
    environment:
      CP_HOST: 0.0.0.0
      CP_PORT: "8402"
      CP_DB_PATH: /data/cp.db
    volumes:
      - cp-data:/data
    expose:
      - "8402"
    labels:
      # Ohne dieses Label fasst der autoheal-Dienst den Container nicht an.
      autoheal: "true"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8402/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  # Docker startet einen Container nur neu, wenn sein Prozess endet, nicht wenn er unhealthy ist.
  # Am 19.09.2026 hing der Startprozess still: Healthcheck rot, Container "Up", Dienst 502, und
  # ohne Eingriff wäre das so geblieben. Dieser Dienst startet unhealthy markierte Container neu.
  autoheal:
    image: willfarrell/autoheal:1.2.0
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: "30"
      AUTOHEAL_START_PERIOD: "60"
      DOCKER_SOCK: /var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "3" }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      cp:
        condition: service_healthy
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

volumes:
  cp-data:
  caddy-data:
  caddy-config:
